<!DOCTYPE html>

    <title>Grid-css-Homework</title>

<style>
    .container{
        display: grid;
    }
    .header{
        display: grid;
        background-color: darkorange;
        grid-template-rows: 200px;
        color: beige;
        font-size: 50px;
        text-align: center;
    }
    .footer{
        display: grid;
        background-color: plum;
        grid-template-rows: 70px;
        font-size: 20px;
        text-align: center;
    }
    .menu{
        display: grid;
        background-color: rgb(161, 255, 230);
        grid-template-columns: 100px 100px 100px;
        column-gap: 100px;
        justify-content: center;
        text-align: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 20px;
        padding-top: 10px;
        padding-bottom: 10px;
    }
    .main{
        display: grid;
        grid-template-columns: repeat(6,220px);
        grid-template-rows: repeat(2,320px);
        justify-content: space-evenly;
        row-gap: 20px;
        column-gap: 20px;
        margin: 20px;
    }
    .item{
        background-color: rgb(233, 231, 231);
        display: grid;
        border-radius: 15px;
        grid-template-rows: 150px 30px 40px 35px;
        grid-template-columns: 200px;
        row-gap: 10px;
        padding-top: 17px;
        justify-content: center;
        text-align: center;
    }
    .btn{
        display: grid;
        grid-template-columns: 60px 60px;
        column-gap: 10px;
        justify-content: center;
    }
    .buy_btn{
        cursor: pointer;
        background-color: rgb(8, 99, 184);
        color: aliceblue;
        border-radius: 8px;
        transition-duration: 0.2s;
        border: none;
        outline: none;
        box-shadow: none;
    }
    .buy_btn:hover{
        background-color: rgb(0, 176, 76);
    }
    .detail_btn{
        cursor: pointer;
        background-color: rgb(255, 255, 255);
        border-radius: 8px;
        border: none;
        outline: none;
        box-shadow: none;
        transition-duration: 0.2s;
    }
    .detail_btn:hover{
